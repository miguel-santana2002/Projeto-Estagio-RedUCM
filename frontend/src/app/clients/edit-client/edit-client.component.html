<app-header></app-header>
<app-titlebanner title="Edição de Clientes" image="./assets/bannercover.jpg"></app-titlebanner>

<div class="container mx-auto px-4 sm:px-8 py-8">
  <div class="max-w-xl mx-auto bg-white dark:bg-gray-700 p-6 rounded-lg shadow-md">

    <div class="flex items-center mb-6 border-b pb-4 dark:border-gray-600">
      <i class="fas fa-building mr-3 text-redshift-red text-xl"></i>
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
        Editar Cliente #{{ clientId }}
      </h3>
    </div>

    <!-- Spinner de Loading -->
    <div *ngIf="isLoading" class="flex justify-center py-6">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-redshift-red"></div>
    </div>

    <!-- Formulário -->
    <form *ngIf="!isLoading" [formGroup]="editClientForm" (ngSubmit)="updateClient()">
      <div class="grid gap-4 mb-4 grid-cols-2">

        <!-- Nome -->
        <div class="col-span-2">
          <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Nome <span class="text-red-500">*</span>
          </label>
          <input type="text" formControlName="name" id="name"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white"
            placeholder="Insira o nome da empresa">
        </div>

        <!-- LogSources -->
        <div class="col-span-2">
          <label for="logsources" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            LogSources <span class="text-red-500">*</span>
          </label>
          <tag-input theme='minimal' [onlyFromAutocomplete]="true" formControlName="logsources"
            secondaryPlaceholder="+ Nova"
            class="block w-full rounded-md border-0 px-2 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
            <tag-input-dropdown [showDropdownIfEmpty]="true" [autocompleteItems]="registeredLogsources">
            </tag-input-dropdown>
          </tag-input>
        </div>

      </div>

      <div *ngIf="errorMessage" class="mb-4 text-red-600 text-sm">
        {{ errorMessage }}
      </div>

      <!-- Botões -->
      <div class="flex justify-end gap-3 pt-4 border-t dark:border-gray-600">
        <button type="button" (click)="cancel()"
          class="text-gray-500 bg-white hover:bg-gray-100 rounded-lg border border-gray-200 text-sm px-4 py-2">
          Cancelar
        </button>
        <button type="submit" [disabled]="editClientForm.invalid"
          class="text-white items-center bg-redshift-red hover:bg-redshift-hover focus:ring-4 focus:outline-none font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
          <i class="fas fa-save"></i>
          <span>Guardar Alterações</span>
        </button>
      </div>
    </form>

  </div>
</div>

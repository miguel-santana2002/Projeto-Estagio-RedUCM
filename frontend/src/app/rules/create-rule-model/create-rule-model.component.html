<app-header></app-header>
<app-titlebanner title="Adicionar Modelo de Regra" image="./assets/bannercover.jpg"></app-titlebanner>

<form class="grid grid-cols-2 gap-12 px-32 pt-12 pb-16 dark:text-white" (ngSubmit)="createRuleModel()"
    [formGroup]="createRuleModelForm">

    <!-- Título -->
    <div class="space-y-4 col-span-2 md:col-span-1">
        <label for="title" class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Título da
            Regra</label>
        <div class="flex flex-col">
            <input id="title" type="text" formControlName="title" required
                class="block w-full rounded-md border-0 px-2 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition">
            <div *ngIf="createRuleModelForm.get('title')?.touched && createRuleModelForm.get('title')?.invalid"
                class="text-red-600 dark:text-red-400 text-sm mt-1">
                O título da regra é obrigatório.
            </div>
        </div>
    </div>

    <!-- Use Case Associado -->
    <div class="space-y-4 col-span-2 md:col-span-1">
        <label for="selectedUseCase" class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Use Case
            Associado</label>
        <select id="selectedUseCase" formControlName="selectedUseCase" [(ngModel)]="selectedUseCase"
            class="mt-1 block w-full py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 dark:focus:ring-indigo-500 sm:text-sm transition">
            <option value="" disabled selected class="text-gray-400">Selecione um Use Case</option>
            <option *ngFor="let option of usecases" [value]="option.id">
                RedUC{{ option.id }} - {{ option.title }}
            </option>
        </select>
        <div *ngIf="createRuleModelForm.get('selectedUseCase')?.touched && createRuleModelForm.get('selectedUseCase')?.invalid"
            class="text-red-600 dark:text-red-400 text-sm mt-1">
            O Use Case Associado é obrigatório.
        </div>
    </div>

    <!-- Tipo (SIEM / SOAR / EDR) -->
    <div class="space-y-4 col-span-2 md:col-span-1">
        <label for="selectedType" class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Tipo</label>
        <select id="selectedType" formControlName="selectedType" [(ngModel)]="selectedType" (change)="onTypeChange()"
            class="mt-1 block w-full py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 dark:focus:ring-indigo-500 sm:text-sm transition">
            <option *ngFor="let option of typeKeys()" [value]="option">{{ option }}</option>
        </select>
    </div>

    <!-- Sintaxe -->
    <div class="space-y-4 col-span-2 md:col-span-1">
        <label for="syntax" class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Sintaxe</label>
        <select id="syntax" formControlName="syntax" [(ngModel)]="selectedSyntax" (change)="onSyntaxChange()"
            class="mt-1 block w-full py-2 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 dark:focus:ring-indigo-500 sm:text-sm transition">
            <option *ngFor="let option of getAvailableSyntaxes()" [value]="option">{{ option }}</option>
        </select>
        <div *ngIf="createRuleModelForm.get('syntax')?.touched && createRuleModelForm.get('syntax')?.invalid"
            class="text-red-600 dark:text-red-400 text-sm mt-1">
            A Sintaxe é obrigatória.
        </div>
    </div>

    <!-- LogSources -->
    <div class="space-y-4 col-span-2">
        <label for="logsources" class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">LogSources
            Associadas</label>
        <tag-input [onlyFromAutocomplete]="true" theme='minimal' [secondaryPlaceholder]="'+ Nova Log Source'"
            [placeholder]="''" formControlName="logsources"
            class="block w-full rounded-md border-0 px-2 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition">
            <tag-input-dropdown [showDropdownIfEmpty]="true" [autocompleteItems]="registeredLogsources">
            </tag-input-dropdown>
        </tag-input>
        <div *ngIf="createRuleModelForm.get('logsources')?.touched && createRuleModelForm.get('logsources')?.invalid"
            class="text-red-600 dark:text-red-400 text-sm mt-1">
            Pelo menos uma LogSource é obrigatória.
        </div>
    </div>

    <!-- Editor de Código -->
    <div class="space-y-4 col-span-2">
        <div class="flex items-center gap-3">
            <label class="block text-sm font-medium leading-6 text-gray-900 dark:text-white mb-0">Regra ({{
                selectedSyntax }})</label>

            <!-- Badge de Exemplo -->
            <span *ngIf="isExampleCode"
                class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-[10px] font-bold px-2 py-0.5 rounded border border-gray-300 dark:border-gray-600 uppercase tracking-wide">
                Exemplo
            </span>

            <!-- Badge de Código Modificado -->
            <span *ngIf="!isExampleCode"
                class="bg-green-100 dark:bg-green-950/40 text-green-800 dark:text-green-400 text-[10px] font-bold px-2 py-0.5 rounded border border-green-400 dark:border-green-800 uppercase tracking-wide">
                Personalizado
            </span>
        </div>

        <div class="w-full border border-gray-300 dark:border-gray-700 mx-auto rounded-md overflow-hidden transition">
            <ngs-code-editor [codeModel]="selectedModel" [theme]="theme" [options]="options"
                (valueChanged)="onCodeChanged($event)" (loaded)="onEditorLoaded($event)"
                (codeModelChanged)="onCodeModelChanged($event)">
            </ngs-code-editor>
        </div>
    </div>

    <!-- Botão Submit -->
    <div class="space-y-6 col-span-2">
        <button type="submit" [disabled]="!createRuleModelForm.valid"
            class="disabled:opacity-60 disabled:cursor-not-allowed w-full md:w-[25rem] py-2.5 px-5 text-white font-semibold bg-redshift-red rounded-md hover:bg-redshift-hover transition duration-150">
            Registar
        </button>
    </div>
</form>

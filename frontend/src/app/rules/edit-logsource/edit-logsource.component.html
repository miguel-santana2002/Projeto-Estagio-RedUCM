<app-header></app-header>
<app-titlebanner title="Edição de Log Source" image="./assets/bannercover.jpg"></app-titlebanner>

<div class="page-container px-4 py-16">

  <!-- Formulário de Edição -->
  <div class="max-w-xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 transition">
    <div class="flex items-center mb-6 border-b pb-4 border-gray-200 dark:border-gray-700">
      <i class="fas fa-file-lines mr-3 text-redshift-red text-xl"></i>
      <div>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
          Editar Log Source #{{ logsourceId }}
        </h3>
        <p class="text-xs text-gray-500 dark:text-gray-400">
          Modifica as propriedades da fonte de dados registada.
        </p>
      </div>
    </div>

    <!-- Spinner de Loading -->
    <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-12 gap-3">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-redshift-red"></div>
      <span class="text-xs text-gray-500 dark:text-gray-400">A carregar detalhes da log source...</span>
    </div>

    <!-- Formulário de Edição -->
    <form *ngIf="!isLoading" [formGroup]="editLogSourceForm" (ngSubmit)="updateLogSource()">
      <div class="grid gap-4 mb-5 grid-cols-2">

        <!-- Nome -->
        <div class="col-span-2">
          <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Nome da Log Source <span class="text-red-500">*</span>
          </label>
          <input type="text" formControlName="name" id="name"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm font-mono rounded-lg focus:ring-redshift-red focus:border-redshift-red block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition"
            placeholder="Ex: windows_security, syslog_firewall...">
          <p *ngIf="editLogSourceForm.get('name')?.invalid && editLogSourceForm.get('name')?.touched"
            class="text-red-600 dark:text-red-400 text-xs mt-1">
            O nome é obrigatório.
          </p>
        </div>

        <!-- Tipo (Type) -->
        <div class="col-span-2 sm:col-span-1">
          <label for="type" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Tipo (Type)
          </label>
          <select id="type" formControlName="type"
            class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-redshift-red focus:border-redshift-red block w-full p-2.5 transition">
            <option value="">— Selecionar Tipo —</option>
            <option *ngFor="let opt of typeOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>

          <!-- Input customizado se Tipo for Outro -->
          <input *ngIf="editLogSourceForm.get('type')?.value === 'other'" type="text" formControlName="customType"
            placeholder="Especificar tipo..."
            class="mt-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded-lg focus:ring-redshift-red focus:border-redshift-red block w-full p-2 transition">
        </div>

        <!-- Método de Recolha (Collector) -->
        <div class="col-span-2 sm:col-span-1">
          <label for="collectionMethod" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Método de Recolha (Collector)
          </label>
          <select id="collectionMethod" formControlName="collectionMethod"
            class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-redshift-red focus:border-redshift-red block w-full p-2.5 transition">
            <option value="">— Selecionar Método —</option>
            <option *ngFor="let opt of collectionOptions" [value]="opt.value">{{ opt.label }}</option>
          </select>

          <!-- Input customizado se Collector for Outro -->
          <input *ngIf="editLogSourceForm.get('collectionMethod')?.value === 'other'" type="text"
            formControlName="customCollection" placeholder="Especificar método..."
            class="mt-2 bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-xs rounded-lg focus:ring-redshift-red focus:border-redshift-red block w-full p-2 transition">
        </div>

        <!-- Descrição -->
        <div class="col-span-2">
          <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Descrição <span class="text-red-500">*</span>
          </label>
          <textarea id="description" rows="4" formControlName="description"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-redshift-red focus:border-redshift-red block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white transition resize-none"
            placeholder="Descrição da finalidade, eventos recolhidos e detalhes técnicos..."></textarea>
          <p *ngIf="editLogSourceForm.get('description')?.invalid && editLogSourceForm.get('description')?.touched"
            class="text-red-600 dark:text-red-400 text-xs mt-1">
            A descrição é obrigatória.
          </p>
        </div>

      </div>

      <!-- Banner de Erro -->
      <div *ngIf="errorMessage"
        class="mb-4 p-3.5 text-sm text-red-700 bg-red-100 rounded-lg dark:bg-red-950/40 dark:text-red-400 border border-red-200 dark:border-red-900/50 flex items-center gap-2">
        <i class="fas fa-exclamation-triangle flex-shrink-0"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Botões de Ação -->
      <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
        <button type="submit" [disabled]="editLogSourceForm.invalid || isSubmitting"
          class="text-white bg-redshift-red hover:bg-redshift-hover focus:ring-4 focus:outline-none font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 shadow-sm transition">
          <i *ngIf="isSubmitting" class="fas fa-spinner fa-spin text-xs"></i>
          <i *ngIf="!isSubmitting" class="fas fa-save text-xs"></i>
          <span>{{ isSubmitting ? 'A guardar...' : 'Guardar Alterações' }}</span>
        </button>

        <button type="button" (click)="cancel()"
          class="w-full sm:w-auto py-2.5 px-6 text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 rounded-lg border border-gray-300 dark:border-gray-600 text-sm font-medium transition text-center shadow-sm">
          Cancelar
        </button>
      </div>
    </form>
  </div>

</div>

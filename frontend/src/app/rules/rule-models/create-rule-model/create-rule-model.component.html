<app-header></app-header>
<app-titlebanner title="Adicionar Regra" image="./assets/bannercover.jpg"></app-titlebanner>
<div *ngIf="message"
    class="fixed top-4 right-4 z-50 flex items-center max-w-xs p-4 text-sm text-gray-800 bg-white dark:bg-gray-800 dark:text-gray-200 rounded-lg shadow border border-gray-200 dark:border-gray-700">
    <i class="fas fa-check text-green-500 mr-3"></i>
    <span>{{ message }}</span>
</div>

<div class="page-container px-4 py-16">

    <form class="grid grid-cols-1 md:grid-cols-2 gap-8 dark:text-white" (ngSubmit)="createRuleModel()"
        [formGroup]="createRuleModelForm">

        <!-- 1. Linha Superior: Use Case, Tipo e Sintaxe na mesma linha -->
        <div class="col-span-1 md:col-span-2 grid grid-cols-1 md:grid-cols-12 gap-6">

            <!-- Use Case Associado (6 colunas) -->
            <div class="space-y-2 md:col-span-6">
                <label for="selectedUseCase" class="block text-sm font-semibold text-gray-900 dark:text-white">
                    Use Case Associado <span class="text-redshift-red">*</span>
                </label>
                <select id="selectedUseCase" formControlName="selectedUseCase" [(ngModel)]="selectedUseCase"
                    (change)="onUseCaseChange()"
                    class="block w-full py-2.5 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-lg shadow-sm focus:ring-2 focus:ring-redshift-red text-sm transition">
                    <option value="" disabled selected class="text-gray-400">Selecione um Use Case</option>
                    <option *ngFor="let option of usecases" [value]="option.id">
                        RedUC{{ option.id }} - {{ option.title }}
                    </option>
                </select>
                <div *ngIf="createRuleModelForm.get('selectedUseCase')?.touched && createRuleModelForm.get('selectedUseCase')?.invalid"
                    class="text-red-600 dark:text-red-400 text-xs mt-1">
                    O Use Case associado é obrigatório.
                </div>
            </div>

            <!-- Tipo (3 colunas) -->
            <div class="space-y-2 md:col-span-3">
                <label for="selectedType" class="block text-sm font-semibold text-gray-900 dark:text-white">Tipo</label>
                <select id="selectedType" formControlName="selectedType" [(ngModel)]="selectedType"
                    (change)="onTypeChange()"
                    class="block w-full py-2.5 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-lg shadow-sm focus:ring-2 focus:ring-redshift-red text-sm transition">
                    <option *ngFor="let option of typeKeys()" [value]="option">{{ option }}</option>
                </select>
            </div>

            <!-- Sintaxe (3 colunas) -->
            <div class="space-y-2 md:col-span-3">
                <label for="syntax" class="block text-sm font-semibold text-gray-900 dark:text-white">Sintaxe</label>
                <select id="syntax" formControlName="syntax" [(ngModel)]="selectedSyntax" (change)="onSyntaxChange()"
                    class="block w-full py-2.5 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-lg shadow-sm focus:ring-2 focus:ring-redshift-red text-sm transition">
                    <option *ngFor="let option of getAvailableSyntaxes()" [value]="option">{{ option }}</option>
                </select>
            </div>
        </div>

        <!-- 2. Título da Regra (Pré-preenchido com 'NomeUseCase - ') -->
        <div class="space-y-2 col-span-1 md:col-span-2">
            <label for="title" class="block text-sm font-semibold text-gray-900 dark:text-white">
                Título da Regra <span class="text-redshift-red">*</span>
            </label>
            <input id="title" type="text" formControlName="title"
                placeholder="ex: Brute Force Detection - SPL para Azure"
                class="block w-full rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm focus:ring-2 focus:ring-redshift-red text-sm transition">
            <div *ngIf="createRuleModelForm.get('title')?.touched && createRuleModelForm.get('title')?.invalid"
                class="text-red-600 dark:text-red-400 text-xs mt-1">
                O título da regra é obrigatório.
            </div>
        </div>

        <!-- 3. LogSources Associadas -->
        <div class="space-y-2 col-span-1 md:col-span-2 relative">
            <div class="flex items-center justify-between">
                <label class="block text-sm font-semibold text-gray-900 dark:text-white">LogSources Associadas</label>
                <span class="text-xs text-gray-400 font-normal">Opcional</span>
            </div>

            <!-- Fundo invisível para fechar o dropdown ao clicar fora -->
            <div *ngIf="isLogsourceOpen" class="fixed inset-0 z-10" (click)="isLogsourceOpen = false"></div>

            <!-- Falso Select (Igual aos outros) -->
            <div (click)="isLogsourceOpen = !isLogsourceOpen"
                class="relative z-20 block w-full py-2.5 px-3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 dark:text-white rounded-lg shadow-sm focus:ring-2 focus:ring-redshift-red text-sm transition cursor-pointer flex justify-between items-center">

                <span class="truncate" [ngClass]="{'text-gray-400': !createRuleModelForm.value.logsources?.length}">
                    {{ getSelectedLogsourcesText() }}
                </span>

                <!-- Ícone da seta (igual ao select nativo) -->
                <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </div>

            <!-- Menu Dropdown com Checkboxes -->
            <div *ngIf="isLogsourceOpen"
                class="absolute z-30 mt-1 w-full bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                <div *ngFor="let option of registeredLogsources" (click)="toggleLogsourceSelection(option, $event)"
                    class="px-3 py-2 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 flex items-center gap-3 text-sm text-gray-900 dark:text-white transition">

                    <input type="checkbox" [checked]="createRuleModelForm.value.logsources?.includes(option)"
                        class="w-4 h-4 rounded border-gray-300 text-redshift-red focus:ring-redshift-red bg-white dark:bg-gray-600 dark:border-gray-500 pointer-events-none">
                    <span>{{ option }}</span>
                </div>

                <div *ngIf="registeredLogsources.length === 0" class="px-3 py-2 text-sm text-gray-500 text-center">
                    Nenhuma Log Source disponível.
                </div>
            </div>
        </div>

        <!-- 4. Editor de Código -->
        <div class="space-y-3 col-span-1 md:col-span-2">
            <div class="flex items-center gap-3">
                <label class="block text-sm font-semibold text-gray-900 dark:text-white mb-0">
                    Regra ({{ selectedSyntax }})
                </label>
                <span *ngIf="isExampleCode"
                    class="bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-[10px] font-bold px-2 py-0.5 rounded border border-gray-300 dark:border-gray-600 uppercase tracking-wide">
                    Exemplo
                </span>
                <span *ngIf="!isExampleCode"
                    class="bg-green-100 dark:bg-green-950/40 text-green-800 dark:text-green-400 text-[10px] font-bold px-2 py-0.5 rounded border border-green-400 dark:border-green-800 uppercase tracking-wide">
                    Personalizado
                </span>
            </div>

            <div class="w-full border border-gray-300 dark:border-gray-700 rounded-lg overflow-hidden">
                <app-code-editor [code]="code" [language]="selectedSyntax" height="420px"
                    (codeChange)="onCodeChanged($event)">
                </app-code-editor>
            </div>
        </div>

        <!-- 5. Ações -->
        <div class="col-span-1 md:col-span-2 flex items-center gap-4 pt-2">
            <button type="submit" [disabled]="!createRuleModelForm.valid"
                class="disabled:opacity-50 disabled:cursor-not-allowed w-full md:w-60 py-2.5 px-5 text-white font-medium bg-redshift-red rounded-lg hover:bg-redshift-hover transition shadow-sm text-sm">
                Registar Regra
            </button>
            <a [routerLink]="['/manage-rules']"
                class="w-full md:w-32 py-2.5 px-4 text-center text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg font-medium transition text-sm">
                Cancelar
            </a>
        </div>
    </form>

</div>

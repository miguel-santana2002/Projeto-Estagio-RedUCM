<div class="max-w-sm w-full bg-white rounded-lg shadow dark:bg-gray-800 p-4 md:p-6">

  <div class="flex justify-between items-start w-full">
    <div class="flex-col items-center">
      <div class="flex items-center mb-1">
        <h5 class="text-xl font-bold leading-none text-gray-900 dark:text-white me-1">Regras Atribuídas por Tipo</h5>

      </div>

    </div>

  </div>

  <!-- Line Chart -->
  <div *ngIf="rules" class="py-6" id="pie-chart3" #chartElementthree></div>

  <div *ngIf="!rules || rules.length === 0"

    <i class="fas fa-chart-pie text-3xl mb-2 opacity-40"></i>
    <span class="text-xs">Sem dados de tipos para apresentar</span>
  </div>

</div>

<app-header></app-header>
<app-titlebanner title="Página Não Encontrada" image="./assets/bannercover.jpg"></app-titlebanner>

<div class="flex items-center justify-center min-h-[60vh] px-6 py-12">
    <div class="text-center max-w-lg">

        <!-- Código de Erro Estilizado -->
        <h1 class="text-8xl font-extrabold tracking-tight text-gray-900">
            4<span class="text-redshift-red">0</span>4
        </h1>

        <h2 class="mt-4 text-2xl font-bold text-gray-800 tracking-tight">
            Página não encontrada
        </h2>

        <p class="mt-3 text-sm text-gray-500 leading-relaxed">
            O recurso ou página que estás a tentar aceder não existe, foi movido ou o identificador fornecido é
            inválido.
        </p>

        <!-- Ações -->
        <div class="mt-8 flex items-center justify-center gap-4">
            <a routerLink="/home"
                class="inline-flex items-center gap-2 px-5 py-2.5 bg-redshift-red hover:bg-redshift-hover text-white text-sm font-semibold rounded-md shadow transition duration-150">
                <i class="fas fa-house text-xs"></i>
                <span>Página Inicial</span>
            </a>

            <button (click)="goBack()"
                class="inline-flex items-center gap-2 px-5 py-2.5 bg-white hover:bg-gray-100 text-gray-700 text-sm font-medium border border-gray-300 rounded-md shadow-sm transition duration-150">
                <i class="fas fa-arrow-left text-xs"></i>
                <span>Voltar Atrás</span>
            </button>
        </div>

    </div>
</div>

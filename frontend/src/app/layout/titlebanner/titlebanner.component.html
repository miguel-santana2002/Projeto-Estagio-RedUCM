<div class="relative w-full h-28 overflow-hidden bg-gray-950 border-b border-gray-800">
  <img [src]="image || './assets/bannercover.jpg'" alt="Banner"
    class="absolute inset-0 object-cover w-full h-full filter brightness-75 contrast-110 select-none pointer-events-none" />

  <div class="absolute inset-0 bg-gradient-to-r from-gray-950/90 via-gray-950/50 to-transparent"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent"></div>

  <div class="relative h-full page-container px-4 flex items-center z-10">
    <div class="flex items-center gap-3.5">
      <div class="h-8 w-1.5 bg-redshift-red rounded-full shadow-[0_0_12px_rgba(239,68,68,0.6)]"></div>
      <!-- Título -->
      <h1 class="text-white font-bold text-2xl md:text-3xl font-inter tracking-tight drop-shadow-md">
        {{ title }}
      </h1>
    </div>
  </div>
</div>

<style>
  .text-shadow {
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }
</style>

<div class="w-full relative h-32 overflow-hidden bg-gray-900">
  <img [src]="image || './assets/bannercover.jpg'" alt="Banner" class="absolute inset-0 object-cover w-full h-full filter brightness-[0.75]" />
  <div class="absolute inset-0 px-20 py-10 bg-opacity-75 text-left flex flex-col justify-center z-10">
    <h1 class="text-white font-bold text-4xl font-inter leading-tight text-shadow drop-shadow-2xl">{{title}}</h1>
  </div>
</div>

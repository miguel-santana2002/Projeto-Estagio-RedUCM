<header class="w-full">
  <nav
    class="bg-white border-b border-gray-200 py-3.5 dark:bg-gray-900 dark:border-gray-800 shadow-sm transition-colors duration-200">
    <div class="flex items-center justify-between max-w-[1440px] px-6 mx-auto">

      <!-- 1. Logo -->
      <a [routerLink]="isLoggedIn ? ['/home'] : ['/']" class="flex items-center shrink-0 mr-6">
        <img src="./assets/logo.png" class="h-7 sm:h-8" alt="Redshift Logo" />
      </a>

      <!-- 2. Links Centrais de Navegação -->
      <div *ngIf="isLoggedIn" class="items-center justify-center hidden lg:flex flex-1" id="mobile-menu-2">
        <ul class="flex font-medium lg:space-x-4 xl:space-x-6">

          <!-- Home -->
          <li>
            <a [routerLink]="['/home']" routerLinkActive="text-redshift-red font-semibold"
              [routerLinkActiveOptions]="{ exact: true }"
              class="block py-2 text-gray-700 dark:text-gray-400 lg:dark:hover:text-white hover:text-redshift-hover transition-colors">
              Home
            </a>
          </li>

          <!-- Utilizadores (Exclusivo Admin / Superuser) -->
          <li *ngIf="isAdmin">
            <a [routerLink]="['/manage-users']" routerLinkActive="text-redshift-red font-semibold"
              class="block py-2 text-gray-700 dark:text-gray-400 lg:dark:hover:text-white hover:text-redshift-hover transition-colors">
              Utilizadores
            </a>
          </li>

          <!-- Clientes (Visível para Admins e Operadores) -->
          <li>
            <a [routerLink]="['/manage-clients']" routerLinkActive="text-redshift-red font-semibold"
              class="block py-2 text-gray-700 dark:text-gray-400 lg:dark:hover:text-white hover:text-redshift-hover transition-colors">
              Clientes
            </a>
          </li>

          <!-- Dropdown Use Cases -->
          <li class="relative">
            <button id="dropdownUseCasesButton" data-dropdown-toggle="dropdownUseCases"
              data-dropdown-placement="bottom-start" type="button"
              [class.text-redshift-red]="isRouteActive(['/manage-usecases', '/create-usecase', '/usecase-details'])"
              [class.font-semibold]="isRouteActive(['/manage-usecases', '/create-usecase', '/usecase-details'])"
              class="flex items-center justify-between w-full py-2 text-gray-700 hover:text-redshift-hover dark:text-gray-400 dark:hover:text-white transition-colors">
              Use Cases
              <i class="fas fa-chevron-down text-xs ml-1.5"></i>
            </button>

            <div id="dropdownUseCases"
              class="z-30 hidden font-normal bg-white divide-y divide-gray-100 rounded-lg shadow-lg w-52 border border-gray-100 dark:bg-gray-700 dark:divide-gray-600 dark:border-gray-600">
              <ul class="py-2 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownUseCasesButton">
                <li>
                  <a [routerLink]="['/create-usecase']"
                    routerLinkActive="bg-gray-100 text-redshift-red font-semibold border-l-4 border-redshift-red dark:bg-gray-600 dark:text-white"
                    class="block px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-600 dark:hover:text-white transition-colors">
                    Criar Use Case
                  </a>
                </li>
                <li>
                  <a [routerLink]="['/manage-usecases']"
                    routerLinkActive="bg-gray-100 text-redshift-red font-semibold border-l-4 border-redshift-red dark:bg-gray-600 dark:text-white"
                    class="block px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-600 dark:hover:text-white transition-colors">
                    Gerir Use Cases
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Dropdown Regras -->
          <li class="relative">
            <button id="dropdownRulesButton" data-dropdown-toggle="dropdownRules" data-dropdown-placement="bottom-start"
              type="button"
              [class.text-redshift-red]="isRouteActive(['/manage-rule-models', '/create-rule-model', '/ruleModel-Details', '/manage-rules', '/rule-Details', '/manage-logsources'])"
              [class.font-semibold]="isRouteActive(['/manage-rule-models', '/create-rule-model', '/ruleModel-Details', '/manage-rules', '/rule-Details', '/manage-logsources'])"
              class="flex items-center justify-between w-full py-2 text-gray-700 hover:text-redshift-hover dark:text-gray-400 dark:hover:text-white transition-colors">
              Regras
              <i class="fas fa-chevron-down text-xs ml-1.5"></i>
            </button>

            <div id="dropdownRules"
              class="z-30 hidden font-normal bg-white divide-y divide-gray-100 rounded-lg shadow-lg w-56 border border-gray-100 dark:bg-gray-700 dark:divide-gray-600 dark:border-gray-600">
              <ul class="py-2 text-sm text-gray-700 dark:text-gray-200" aria-labelledby="dropdownRulesButton">
                <li>
                  <a [routerLink]="['/create-rule-model']"
                    routerLinkActive="bg-gray-100 text-redshift-red font-semibold border-l-4 border-redshift-red dark:bg-gray-600 dark:text-white"
                    class="block px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-600 dark:hover:text-white transition-colors">
                    Criar Regra
                  </a>
                </li>

                <hr class="border-gray-200 dark:border-gray-600 my-1">

                <li>
                  <a [routerLink]="['/manage-rules']"
                    routerLinkActive="bg-gray-100 text-redshift-red font-semibold border-l-4 border-redshift-red dark:bg-gray-600 dark:text-white"
                    class="block px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-600 dark:hover:text-white transition-colors">
                    Gerir Regras
                  </a>
                </li>

                <hr class="border-gray-200 dark:border-gray-600 my-1">

                <li>
                  <a [routerLink]="['/manage-logsources']"
                    routerLinkActive="bg-gray-100 text-redshift-red font-semibold border-l-4 border-redshift-red dark:bg-gray-600 dark:text-white"
                    class="block px-4 py-2 hover:bg-gray-50 dark:hover:bg-gray-600 dark:hover:text-white transition-colors">
                    Gerir Logsources
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Estatísticas -->
          <li>
            <a [routerLink]="['/statistics']" routerLinkActive="text-redshift-red font-semibold"
              class="block py-2 text-gray-700 dark:text-gray-400 lg:dark:hover:text-white hover:text-redshift-hover transition-colors">
              Estatísticas
            </a>
          </li>

          <!-- Auditoria -->
          <li *ngIf="isAdmin">
            <a [routerLink]="['/audit']" routerLinkActive="text-redshift-red font-semibold"
              class="block py-2 text-gray-700 dark:text-gray-400 lg:dark:hover:text-white hover:text-redshift-hover transition-colors">
              Auditoria
            </a>
          </li>

        </ul>
      </div>

      <!-- 3. Ações do Extremo Direito -->
      <div class="flex items-center shrink-0 ml-6">

        <ng-container *ngIf="isLoggedIn">
          <span class="text-gray-600 dark:text-gray-300 text-xs xl:text-sm whitespace-nowrap">
            Bem-vindo,&#160;<span class="font-medium text-gray-800 dark:text-white">{{ user?.email || user?.username
              }}</span>
          </span>

          <button (click)="logout()" type="button" title="Terminar Sessão"
            class="dark:text-white hover:bg-gray-50 focus:ring-4 focus:ring-gray-300 font-medium rounded-lg text-sm px-2.5 py-1.5 ml-2 text-redshift-red dark:hover:bg-gray-700 focus:outline-none dark:focus:ring-gray-800 transition">
            <i class="fas fa-sign-out-alt text-base"></i>
          </button>
        </ng-container>

        <ng-container *ngIf="!isLoggedIn">
          <a [routerLink]="['/login']"
            class="text-white bg-redshift-red hover:bg-redshift-hover focus:ring-4 focus:ring-red-200 font-medium rounded-lg text-sm px-4 py-2 focus:outline-none transition">
            Login
          </a>
        </ng-container>

        <div class="h-5 w-px bg-gray-300 dark:bg-gray-600 mx-2"></div>

        <button (click)="themeService.toggleTheme()" type="button" title="Alternar Tema"
          class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm p-2 w-9 h-9 flex items-center justify-center transition">
          <i *ngIf="themeService.isDarkMode" class="fas fa-sun text-base text-yellow-400"></i>
          <i *ngIf="!themeService.isDarkMode" class="fas fa-moon text-base text-gray-700 dark:text-gray-300"></i>
        </button>

        <button *ngIf="isLoggedIn" data-collapse-toggle="mobile-menu-2" type="button"
          class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
          aria-controls="mobile-menu-2" aria-expanded="false">
          <span class="sr-only">Abrir menu</span>
          <i class="fas fa-bars w-5 h-5 flex items-center justify-center"></i>
        </button>

      </div>

    </div>
  </nav>
</header>

<app-header></app-header>
<app-titlebanner title="Criar Use Case" image="./assets/bannercover.jpg"></app-titlebanner>

<div class="max-w-6xl mx-auto p-6 bg-white dark:bg-gray-900 rounded-xl shadow-md mt-6 mb-12">
  <form [formGroup]="createUseCaseForm" (ngSubmit)="createUseCase()" class="space-y-6">

    <!-- Mensagem de Erro -->
    <div *ngIf="errorMessage" class="p-4 bg-red-100 dark:bg-red-900/30 border border-red-400 text-red-700 dark:text-red-300 rounded-lg text-sm">
      {{ errorMessage }}
    </div>

    <!-- Título -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Título do Use Case *</label>
      <input type="text" formControlName="title" placeholder="Ex: Detecção de WMI Malicioso" 
             class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition" />
    </div>

    <!-- Descrição -->
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Descrição</label>
      <textarea formControlName="description" rows="3" placeholder="Descreva o propósito deste Use Case..."
                class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
    </div>

    <!-- Grelha de Seleções (Táticas e Técnicas) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Táticas -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Táticas (MITRE ATT&CK)</label>
        <mat-form-field appearance="outline" class="w-full">
          <!-- A correção está aqui: panelClass="custom-dark-panel" -->
          <mat-select formControlName="tactics" multiple placeholder="Selecione as táticas..." (selectionChange)="onTacticChange()" panelClass="custom-dark-panel">
            <mat-option *ngFor="let tactic of allTacticsList" [value]="tactic">{{ tactic }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Técnicas -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Técnicas MITRE</label>
        <mat-form-field appearance="outline" class="w-full">
          <!-- A correção está aqui: panelClass="custom-dark-panel" -->
          <mat-select formControlName="mitreTechniques" multiple placeholder="Selecione as técnicas..." (selectionChange)="onTechniqueChange()" panelClass="custom-dark-panel">
            <mat-option *ngFor="let tech of filteredTechniquesList" [value]="tech">{{ tech }}</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

    </div>

    <!-- Taxonomia CNCS (Classe e Tipo) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Classe CNCS -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Classe CNCS</label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="cncsClass" (selectionChange)="updateCNCSValues()" placeholder="Selecione a classe...">
            <!-- Opção para limpar a seleção à moda antiga -->
            <mat-option value="">-- Nenhuma --</mat-option>
            <mat-option *ngFor="let chave of chavesTaxonomia" [value]="chave">{{ chave }}</mat-option>
          </mat-select>
        </mat-form-field>
        
        <!-- Aparece apenas se selecionar "Outro" -->
        <input *ngIf="createUseCaseForm.get('cncsClass')?.value === 'Outro'" type="text" formControlName="cncsClassCustom" placeholder="Especifique a classe..." 
               class="mt-2 w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition" />
      </div>

      <!-- Tipo CNCS -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Tipo CNCS</label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="cncsType" placeholder="Selecione o tipo...">
            <mat-option value="">-- Nenhuma --</mat-option>
            <mat-option *ngFor="let val of selectedCategoryValues" [value]="val">{{ val }}</mat-option>
          </mat-select>
        </mat-form-field>
        
        <!-- Aparece apenas se selecionar "Outro" -->
        <input *ngIf="createUseCaseForm.get('cncsType')?.value === 'Outro'" type="text" formControlName="cncsTypeCustom" placeholder="Especifique o tipo..." 
               class="mt-2 w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition" />
      </div>

    </div>

    <!-- Mitigação e Playbook -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Mitigação</label>
        <textarea formControlName="mitigation" rows="2" placeholder="Passos de mitigação..."
                  class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Playbook (Ficheiro)</label>
        <input type="file" (change)="onFileSelected($event)"
               class="w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 dark:file:bg-gray-800 dark:file:text-blue-400 hover:file:bg-blue-100 transition" />
      </div>
    </div>

    <!-- Botões de Ação -->
    <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200 dark:border-gray-800">
      <button type="button" routerLink="/manage-usecases" 
              class="px-6 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition">
        Cancelar
      </button>
      <button type="submit" 
              class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow transition">
        Criar Use Case
      </button>
    </div>

  </form>
</div>

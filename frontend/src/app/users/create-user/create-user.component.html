<app-header></app-header>

<app-titlebanner title="Registo de Utilizador" image="./assets/bannercover.jpg"></app-titlebanner>

<div class="mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-16 mt-8">

        <!-- Passo 1: Seleção de Tipo -->
        <div>
            <h1 class="font-inter font-semibold text-2xl text-gray-700 dark:text-white mb-12">1. Selecione o tipo de
                Utilizador</h1>
            <div class="space-y-6">
                <!-- Botão Administrador -->
                <button (click)="trueIsAdminSelected()" type="button"
                    class="text-left flex flex-col md:flex-row h-auto md:h-26 w-full md:max-w-[25rem] items-center bg-white border border-gray-200 rounded-lg shadow hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:hover:bg-gray-700 transition duration-150"
                    [class.drop-shadow-xl]="isAdminSelected" [class.ring-2]="isAdminSelected"
                    [class.ring-redshift-red]="isAdminSelected" [class.opacity-100]="isAdminSelected"
                    [class.opacity-45]="!isAdminSelected">
                    <i class="fas fa-user-tie fa-4x text-redshift-red drop-shadow-md ml-7 mb-1 md:mr-3"></i>
                    <div class="flex flex-col justify-between p-4 leading-normal">
                        <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Administrador
                        </h5>
                        <p class="mb-3 font-normal text-gray-500 dark:text-gray-400">Conta de acesso total ao sistema.
                        </p>
                    </div>
                </button>

                <!-- Botão Operador Redshift -->
                <button (click)="falseIsAdminSelected()" type="button"
                    class="text-left flex flex-col md:flex-row h-auto md:h-26 w-full md:max-w-[25rem] items-center bg-white border border-gray-200 rounded-lg shadow hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:hover:bg-gray-700 transition duration-150"
                    [class.drop-shadow-xl]="!isAdminSelected" [class.ring-2]="!isAdminSelected"
                    [class.ring-redshift-red]="!isAdminSelected" [class.opacity-100]="!isAdminSelected"
                    [class.opacity-45]="isAdminSelected">
                    <i class="fas fa-wrench fa-4x text-redshift-red drop-shadow-md ml-7 mb-1 md:mr-3"></i>
                    <div class="flex flex-col justify-between p-4 leading-normal">
                        <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">Operador
                            Redshift</h5>
                        <p class="mb-3 font-normal text-gray-500 dark:text-gray-400">Operador associado a um cliente
                            específico, com acesso limitado.</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Passo 2: Formulário -->
        <div>
            <h1 class="font-inter font-semibold text-2xl text-gray-700 dark:text-white mb-12">2. Efetue o registo</h1>
            <form class="grid grid-cols-2 gap-8 md:gap-12" (ngSubmit)="createUser()" [formGroup]="createUserForm"
                *ngIf="createUserForm">

                <!-- Nome -->
                <div class="space-y-4 col-span-2 md:col-span-1">
                    <label for="username"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Nome</label>
                    <input id="username" [(ngModel)]="user.username" name="username" type="text"
                        formControlName="username" required
                        class="block w-full rounded-md border-0 px-2 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition">
                    <div *ngIf="username?.invalid && (username?.touched || username?.dirty)"
                        class="text-red-600 dark:text-red-400 text-sm">
                        <div *ngIf="username?.errors?.['required']">Nome é obrigatório.</div>
                    </div>
                </div>

                <!-- Clientes Atribuídos -->
                <div class="space-y-4 col-span-2 md:col-span-1">
                    <label for="companies"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Clientes
                        Atribuídos</label>
                    <select multiple formControlName="companies" name="companies" id="companies"
                        [disabled]="isAdminSelected"
                        class="block w-full rounded-md border-0 px-2 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition disabled:opacity-45 disabled:bg-gray-100 dark:disabled:bg-gray-800 dark:disabled:text-gray-500">
                        <option *ngFor="let client of clientNames" [value]="client">{{ client }}</option>
                    </select>
                    <div *ngIf="!isAdminSelected && companies?.touched && companies?.invalid"
                        class="text-red-600 dark:text-red-400 text-sm">
                        <div *ngIf="companies?.errors?.['required']">Clientes Atribuídos são obrigatórios para Operador
                            Redshift.</div>
                    </div>
                </div>

                <!-- Email -->
                <div class="space-y-4 col-span-2 md:col-span-1">
                    <label for="email"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Email</label>
                    <input id="email" name="email" [(ngModel)]="user.email" type="email" formControlName="email"
                        required
                        class="block w-full rounded-md border-0 px-2 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition">
                    <div *ngIf="email?.invalid && (email?.touched || email?.dirty)"
                        class="text-red-600 dark:text-red-400 text-sm">
                        <div *ngIf="email?.errors?.['required']">Email é obrigatório.</div>
                        <div *ngIf="email?.errors?.['email']">Email não é válido.</div>
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-4 col-span-2 md:col-span-1">
                    <label for="password"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Password</label>
                    <input id="password" name="password" type="password" formControlName="password" required
                        class="block w-full rounded-md border-0 px-2 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition">
                    <div *ngIf="password?.invalid && (password?.touched || password?.dirty)"
                        class="text-red-600 dark:text-red-400 text-sm">
                        <div *ngIf="password?.errors?.['required']">Password é obrigatório.</div>
                        <div *ngIf="password?.errors?.['minlength']">Password deve ter pelo menos 6 caracteres.</div>
                    </div>
                </div>

                <!-- Método OTP -->
                <div class="space-y-4 col-span-2 md:col-span-1">
                    <label for="otpMethod"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-white">Método OTP</label>
                    <select id="otpMethod" name="otpMethod" formControlName="otpMethod"
                        class="block w-full rounded-md border-0 px-2 py-2.5 text-gray-900 bg-white dark:bg-gray-700 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 sm:text-sm sm:leading-6 transition">
                        <option value="email">Email</option>
                        <option value="totp">TOTP</option>
                    </select>
                </div>

                <!-- Botão Registar -->
                <div class="space-y-6 col-span-2">
                    <button type="submit" [disabled]="createUserForm.invalid"
                        class="disabled:opacity-60 disabled:cursor-not-allowed w-full md:w-[25rem] py-2.5 px-5 text-white font-semibold bg-redshift-red rounded-md hover:bg-redshift-hover transition duration-150">
                        Registar
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

<app-header></app-header>

<app-titlebanner title="Gestão de Clientes" image="./assets/bannercover.jpg"> </app-titlebanner>

<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    integrity="sha512-..." crossorigin="anonymous" />

</head>

<div class="container mx-auto px-4 sm:px-8">
  <div class="py-8">
    <div class="-mx-4 sm:-mx-8 px-4 sm:px-8 py-4 overflow-x-auto">
      <div class="inline-block min-w-full shadow-md p-5 rounded-lg overflow-hidden">

        <!-- Add a search input for name -->

        <div class="mb-4 relative ">

          <label for="nameSearch" class="sr-only">Procurar por nome</label>
          <div class="flex items-center">
            <i class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <span class="fas fa-search"></span>
            </i>
            <input type="text" id="nameSearch" [(ngModel)]="nameSearch" placeholder="Procurar por nome"
              class="pl-10 px-4 py-2 border rounded w-full">

            <button (click)="openCreateModal()" type="button"
              class="ml-5 w-48 h-10 bg-redshift-red text-white rounded hover:bg-redshift-hover shadow-md">
              <i class="fas fa-plus"></i>
              Adicionar Novo
            </button>
          </div>

        </div>

        <table class="min-w-full leading-normal ">
          <thead>
            <tr>
              <th (click)="sortTable('pk')"
                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                ID Cliente
                <span [class]="sortType === 'pk' ? (sortReverse ? 'fas fa-caret-up' : 'fas fa-caret-down') : ''"></span>
              </th>
              <th (click)="sortTable('name')"
                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                Nome
                <span
                  [class]="sortType === 'name' ? (sortReverse ? 'fas fa-caret-up' : 'fas fa-caret-down') : ''"></span>
              </th>
              <th (click)="sortTable('logsources')"
                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                Logsources
                <span
                  [class]="sortType === 'logsources' ? (sortReverse ? 'fas fa-caret-up' : 'fas fa-caret-down') : ''"></span>
              </th>
              <th (click)="sortTable('date')"
                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                Data de Registo
                <span
                  [class]="sortType === 'date' ? (sortReverse ? 'fas fa-caret-up' : 'fas fa-caret-down') : ''"></span>
              </th>
              <th
                class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">
                Ação
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let c of filteredClients"
              [class]="(filteredClients.indexOf(c) % 2 === 0 ? 'bg-white' : 'bg-gray-100')"
              class="hover:drop-shadow-md transition duration-100">

              <!-- Mantém o ID real da BD (c.pk) para rastreabilidade -->
              <td class="px-5 py-5 text-left cursor-pointer">{{ c.pk }}</td>

              <td class="px-5 py-5 text-left cursor-pointer">{{ c.name }}</td>

              <td class="px-5 py-5 text-left cursor-pointer">
                <!-- Flex-wrap e gap aplicados -->
                <div class="flex flex-wrap items-center relative gap-1">

                  <!-- Etiquetas com quebra de texto e largura adaptável -->
                  <div *ngFor="let logsource of c.logsources.slice(0, 4)"
                    class="bg-[#0d2f52] text-white text-center text-[12px] rounded-md px-2 py-1 h-auto min-w-[60px] max-w-[150px] whitespace-normal break-words">
                    {{ logsource }}
                  </div>

                  <div *ngIf="c.logsources.length > 4" class="relative group">
                    <div
                      class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-max max-w-xs bg-white text-black border border-gray-200 rounded-md shadow-xl opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-[9999]">
                      <ul class="p-2 text-sm">
                        <!-- Adicionado espaçamento, limite de quebra de linha (break-words) e um sublinhado subtil entre itens -->
                        <li *ngFor="let extraLogsource of c.logsources.slice(4)"
                          class="py-1 px-2 border-b border-gray-100 last:border-b-0 whitespace-normal break-words">
                          {{ extraLogsource }}
                        </li>
                      </ul>
                    </div>
                    <button
                      class="bg-[#0d2f52] text-white text-center text-[12px] rounded-full w-8 h-8 flex items-center justify-center z-50 relative cursor-pointer">
                      +{{ c.logsources.length - 4 }}
                    </button>
                  </div>
                </div>
              </td>
              <td class="px-5 py-5 text-left cursor-pointer">{{ c.date | date: 'dd/MM/yyyy' }}</td>
              <td class="px-5 py-5">
                <button (click)="updateSelectDelete(c.pk); openModal()"
                  class="bg-red-500 text-white px-3 py-1 rounded-md hover:shadow-lg transition duration-300">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <div *ngIf="isCreateModalOpen" class="bg-gray-900 bg-opacity-50 dark:bg-opacity-80 fixed inset-0 z-40"></div>

        <div tabindex="-1" aria-hidden="true"
          class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
          [ngClass]="{'hidden': !isCreateModalOpen, 'flex': isCreateModalOpen}">
          <div class="relative p-4 w-full max-w-md max-h-full">
            <!-- Modal content -->
            <div class="relative bg-white rounded-lg shadow dark:bg-gray-700">
              <!-- Modal header -->
              <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
                <i class="fas fa-building mr-3 text-redshift-red"></i>

                <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                  Adicionar novo
                </h3>

                <button type="button"
                  class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white"
                  data-modal-toggle="crud-modal">
                  <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                  </svg>
                  <span class="sr-only">Close modal</span>
                </button>



              </div>

              <!-- Modal body -->

              <form class="p-4 md:p-5" (ngSubmit)="createClient()" [formGroup]="createClientForm"
                *ngIf="createClientForm">
                <div class="grid gap-4 mb-4 grid-cols-2">
                  <div class="col-span-2">
                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                      Nome <span class="text-red-500">*</span>
                    </label>
                    <input type="text" formControlName="name" name="name" id="name"
                      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500"
                      placeholder="Insira o nome da empresa">
                  </div>

                  <div class="col-span-2">
                    <label for="logsources" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
                      LogSources <span class="text-red-500">*</span>
                    </label>
                    <tag-input theme='minimal' [onlyFromAutocomplete]="true" formControlName="logsources"
                      secondaryPlaceholder="+ Nova"
                      class="block w-full rounded-md border-0 px-2  text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
                      <tag-input-dropdown [showDropdownIfEmpty]="true" [autocompleteItems]="registeredLogsources">
                      </tag-input-dropdown>
                    </tag-input>

                  </div>

                </div>

                <div *ngIf="errorMessage" class="mb-4 text-red-600">
                  {{ errorMessage }}
                </div>

                <button type="submit" [disabled]="createClientForm.invalid"
                  class="text-white items-center bg-redshift-red hover:bg-redshift-hover focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:opacity-50 disabled:cursor-not-allowed dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                  <i class="fas fa-plus"></i> Criar Cliente
                </button>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>


<div id="deleteModal" tabindex="-1" aria-hidden="true"
  class="bg-gray-900/50 dark:bg-gray-900/80 hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-modal md:h-full"
  #modal>
  <div class="relative p-4 w-full max-w-md h-full md:h-auto">
    <!-- Modal content -->
    <div class="relative p-4 text-center bg-white rounded-lg shadow dark:bg-gray-800 sm:p-5">
      <button type="button" (click)="closeModal()"
        class="text-gray-400 absolute top-2.5 right-2.5 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white">
        <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd"
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
            clip-rule="evenodd"></path>
        </svg>
        <span class="sr-only">Fechar</span>
      </button>
      <svg class="text-gray-400 dark:text-gray-500 w-11 h-11 mb-3.5 mx-auto" aria-hidden="true" fill="currentColor"
        viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd"
          d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
          clip-rule="evenodd"></path>
      </svg>
      <p class="mb-4 text-gray-500 dark:text-gray-300">Tem a certeza que quer eliminar o cliente #{{ selectDelete }}?
      </p>
      <div class="flex justify-center items-center space-x-4">
        <button (click)="closeModal()" type="button"
          class="py-2 px-3 text-sm font-medium text-gray-500 bg-white rounded-lg border border-gray-200 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-primary-300 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
          Não, cancelar
        </button>
        <button (click)="deleteClient(); closeModal()" data-modal-target="deleteModal"
          class="py-2 px-3 text-sm font-medium text-center text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none focus:ring-red-300 dark:bg-red-500 dark:hover:bg-red-600 dark:focus:ring-red-900">
          Sim, tenho a certeza
        </button>
      </div>
    </div>
  </div>
</div>
